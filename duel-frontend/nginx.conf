server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api-duel.benribs.fr; connect-src 'self' https://api-duel.benribs.fr" always;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de proxy /api ici : l'API est jointe directement sur son propre domaine.
    #
    # Chaque domaine doit atteindre son conteneur en UN SEUL saut de proxy. Si ce
    # conteneur relayait aussi /api, ce chemin traverserait deux relais (Apache
    # puis nginx) alors que le domaine de l'API n'en traverse qu'un. `trust proxy`
    # étant un nombre unique côté API, l'un des deux chemins serait mal interprété
    # et la limitation de débit y redeviendrait un compteur global partagé.

    # Static assets with cache headers.
    # Attention : dès qu'un bloc déclare son propre add_header, nginx cesse
    # d'hériter de ceux du parent. Les en-têtes de sécurité doivent donc être
    # répétés ici, sinon les .js/.css/.svg sont servis sans nosniff ni CSP.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api-duel.benribs.fr; connect-src 'self' https://api-duel.benribs.fr" always;
    }
}
